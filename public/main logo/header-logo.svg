<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Violet to Neon Magenta Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Accent glow gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- ICON BADGE (48x48 icon centered vertically) -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbit Ring -->
    <path d="M 40 4 A 36 36 0 1 0 76 40" fill="none" stroke="url(#primaryGrad)" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Trading Growth Bars -->
    <rect x="22" y="44" width="7" height="18" rx="2" fill="#0f0a1c" />
    <rect x="33" y="34" width="7" height="28" rx="2" fill="#7e22ce" />
    <rect x="44" y="24" width="7" height="38" rx="2" fill="url(#primaryGrad)" />
    
    <!-- Sharp Bullish Trend Arrow -->
    <path d="M 18 56 Q 38 46 68 14" fill="none" stroke="#d946ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="68,6 74,18 61,17" fill="#d946ef" />
    
    <!-- Dynamic Bull Sparkle -->
    <circle cx="68" cy="14" r="3" fill="#ffffff" />
  </g>

  <!-- BRAND TYPOGRAPHY: ORVEXA -->
  <g transform="translate(106, 56)">
    <text font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="#0f0a1c">ORVEX<tspan fill="url(#primaryGrad)">A</tspan></text>
  </g>

  <!-- SUBTITLE TAGLINE -->
  <g transform="translate(108, 77)">
    <text font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="4.2" fill="#7e22ce">INVEST TODAY <tspan fill="#d946ef">•</tspan> GROW TOMORROW</text>
  </g>
</svg>
